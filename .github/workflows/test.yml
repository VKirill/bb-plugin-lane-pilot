# Type check and full test run on every push: the deploy (infrastructure/plugin-deploy/bb-plugin-push)
# waits for this check on the HEAD it ships instead of running the suite on a server of its own.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Full history and a local main: parity tests read main's files (git show main:…), bisect tests walk commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git rev-parse --verify -q refs/heads/main >/dev/null || git branch main origin/main
      # The same Node as the old test host (OVH): the node --test inventory accepts versions it knows.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      # Sandbox tests need bubblewrap; sqlite3 is read by the hub-side helpers.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap sqlite3
      - run: git config --global user.name ci && git config --global user.email ci@localhost && git config --global init.defaultBranch main
      - run: npm ci --no-audit --no-fund
      # The live-window tests (scripts/lp-ui-drive.mjs) drive a real Chromium through Playwright.
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
        env:
          NO_COLOR: "1"
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"
