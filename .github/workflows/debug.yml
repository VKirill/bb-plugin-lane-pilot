name: debug
on: [push]
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git rev-parse --verify -q refs/heads/main >/dev/null || git branch main origin/main
      - uses: actions/setup-node@v4
        with: { node-version: 24.15.0, cache: npm }
      - run: git config --global user.name ci && git config --global user.email ci@localhost && git config --global init.defaultBranch main
      - name: bisect repro
        run: |
          set -x; git --version; d=$(mktemp -d); cd $d; git init -q r; cd r
          echo 1 > b; git add .; git commit -qm c1; good=$(git rev-parse HEAD)
          touch a.txt; git add .; git commit -qm c2; echo x>c; git add .; git commit -qm c3
          git rm -q a.txt; git commit -qm c4; bad=$(git rev-parse HEAD)
          git worktree add -q --detach ../s $bad; cd ../s
          git bisect start $bad $good; git bisect run /bin/bash -lc "test -f a.txt"; echo rc=$?; git bisect log; git bisect reset
          /bin/bash -lc 'pwd; echo PROFILE_OK'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run tests/verification/integration-gate-bisect.test.ts tests/baseline/regress.test.ts tests/sma/four-proofs-r27-a.test.ts tests/workflow/chain-executors.test.ts 2>&1 | grep -v -E '^\s+✓' | tail -150
